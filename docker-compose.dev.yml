services:
  postgres:
    image: postgres:15
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - '4000:4000'
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    command: npm run dev
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file: .env
    ports:
      - '5173:5173'
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev
    environment:
      VITE_API_URL: http://localhost:4000

volumes:
  postgres-data: